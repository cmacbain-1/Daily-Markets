<!doctype html>
<html lang="en">
<head>
{% include "head.html" %}
  <title>Past editions | {{ paper.name }}</title>
</head>
<body>
  <div class="page">
    <div class="topbar"><a href="{{ root }}index.html">Today's edition</a> <a href="{{ root }}about.html">About</a></div>
    <header class="masthead">
      <a class="title" href="{{ root }}index.html">{{ paper.name }}</a>
      <p class="tagline">Past editions</p>
    </header>
    <main class="archive">
      <ul>
        {% for e in editions %}
        <li><a href="{{ e.href }}"><span class="archive-date">{{ e.date }}</span> <span class="archive-headline">{{ e.headline | safe }}</span></a></li>
        {% endfor %}
      </ul>
    </main>
{% include "footer.html" %}
  </div>
</body>
</html>
