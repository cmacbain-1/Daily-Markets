<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Past editions | {{ paper.name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  {% include "style.html" %}
</head>
<body>
  <div class="page">
    <div class="topbar"><a href="{{ root }}index.html">Today's edition</a></div>
    <header class="masthead">
      <a class="title" href="{{ root }}index.html">{{ paper.name }}</a>
      <p class="tagline">Past editions</p>
    </header>
    <main class="archive">
      <ul>
        {% for e in editions %}
        <li><a href="{{ e.href }}"><span class="archive-date">{{ e.date }}</span> <span class="archive-headline">{{ e.headline | safe }}</span></a></li>
        {% endfor %}
      </ul>
    </main>
    <footer class="footer"><p>For information and education only - not financial advice.</p></footer>
  </div>
</body>
</html>
