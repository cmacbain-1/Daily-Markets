<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Past editions | The Morning Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
  :root {
    --paper: #f8f6f0;
    --ink: #151412;
    --ink-2: #4d4a44;
    --muted: #7d7a72;
    --rule: #d9d5ca;
    --rule-strong: #151412;
    --up: #006300;
    --down: #b42323;
    --serif: "Source Serif 4", Georgia, serif;
    --display: "Playfair Display", Georgia, serif;
    --sans: Inter, "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 18px; line-height: 1.6; }
  a { color: inherit; }
  .page { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }

  .topbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 0; font-family: var(--sans); font-size: 13px; color: var(--ink-2); border-bottom: 1px solid var(--rule); }
  .masthead { text-align: center; padding: 24px 0 16px; border-bottom: 3px double var(--rule-strong); }
  .masthead .title { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 8vw, 84px); line-height: 1; text-decoration: none; letter-spacing: -0.01em; }
  .tagline { margin: 10px 0 0; font-style: italic; color: var(--ink-2); font-size: 16px; }

  .strip { display: flex; gap: 0; overflow-x: auto; border-bottom: 1px solid var(--rule-strong); font-family: var(--sans); font-size: 13px; scrollbar-width: thin; }
  .strip-item { flex: 1 0 auto; display: flex; flex-direction: column; padding: 10px 14px; border-right: 1px solid var(--rule); white-space: nowrap; }
  .strip-item:last-child { border-right: 0; }
  .strip-name { color: var(--muted); font-size: 12px; }
  .strip-level { font-weight: 600; font-variant-numeric: tabular-nums; }

  .chg { font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--up); }
  .chg.down { color: var(--down); }

  .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 48px; padding-top: 32px; }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 32px; } }

  .headline { font-family: var(--display); font-weight: 700; font-size: clamp(32px, 5vw, 50px); line-height: 1.1; margin: 0 0 16px; text-wrap: balance; }
  .standfirst { font-size: 21px; line-height: 1.45; color: var(--ink-2); margin: 0 0 24px; padding-bottom: 24px; border-bottom: 1px solid var(--rule); }
  .article h2 { font-family: var(--sans); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin: 36px 0 12px; padding-top: 12px; border-top: 2px solid var(--rule-strong); }
  .article section:first-of-type h2 { border-top: 0; padding-top: 0; margin-top: 0; }
  .article section:first-of-type > p:first-of-type::first-letter { font-family: var(--display); float: left; font-size: 64px; line-height: 0.85; padding: 6px 8px 0 0; font-weight: 700; }
  .article p { margin: 0 0 16px; }
  .article ul { padding-left: 20px; }
  .article li { margin-bottom: 8px; }
  figure { margin: 24px 0; }
  figure img { width: 100%; height: auto; display: block; border: 1px solid var(--rule); }
  figcaption { font-family: var(--sans); font-size: 13px; color: var(--muted); margin-top: 6px; }
  .article .sources ul { font-family: var(--sans); font-size: 13px; color: var(--ink-2); }
  .article .sources li { margin-bottom: 4px; }
  .sources a { word-break: break-word; }

  .glance-title { font-family: var(--display); font-size: 24px; margin: 0 0 8px; padding-bottom: 8px; border-bottom: 2px solid var(--rule-strong); }
  .glance table { width: 100%; border-collapse: collapse; font-family: var(--sans); font-size: 13px; margin-bottom: 24px; }
  .glance caption { text-align: left; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; padding: 8px 0 4px; border-bottom: 1px solid var(--rule-strong); }
  .glance th, .glance td { padding: 5px 0; border-bottom: 1px solid var(--rule); text-align: right; font-variant-numeric: tabular-nums; }
  .glance th[scope="row"], .glance thead th:first-child { text-align: left; font-weight: 400; padding-right: 8px; }
  .glance thead th { color: var(--muted); font-weight: 400; font-size: 11px; }
  .glance td { padding-left: 8px; white-space: nowrap; }

  .archive ul { list-style: none; padding: 0; margin: 24px 0; }
  .archive li { border-bottom: 1px solid var(--rule); }
  .archive a { display: flex; gap: 16px; padding: 14px 0; text-decoration: none; }
  .archive-date { font-family: var(--sans); font-size: 13px; color: var(--muted); min-width: 120px; padding-top: 3px; }
  .archive-headline { font-family: var(--display); font-size: 20px; font-weight: 700; }

  .footer { margin-top: 48px; padding-top: 16px; border-top: 3px double var(--rule-strong); font-family: var(--sans); font-size: 13px; color: var(--ink-2); }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar"><a href="index.html">Today's edition</a></div>
    <header class="masthead">
      <a class="title" href="index.html">The Morning Ledger</a>
      <p class="tagline">Past editions</p>
    </header>
    <main class="archive">
      <ul>
        
        <li><a href="editions/2026-10-20/"><span class="archive-date">Tue 20 Oct 2026</span> <span class="archive-headline">Oil Slides on Iran Hopes as Dow Rallies and Tech Lags</span></a></li>
        
      </ul>
    </main>
    <footer class="footer"><p>For information and education only - not financial advice.</p></footer>
  </div>
</body>
</html>
